<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje enviado — Esther García Delgado</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#060d08">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --text:#1E3008; --muted:rgba(255,255,255,0.55); --accent-mid:#5EAD8A;
            --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:var(--sans); min-height:100vh;
            display:flex; align-items:center; justify-content:center; text-align:center;
            padding:48px 24px; color:#fff;
            background:
                radial-gradient(ellipse 1000px 700px at 18% 65%, rgba(30,68,50,0.75) 0%, transparent 60%),
                radial-gradient(ellipse 700px 600px at 78% 28%, rgba(18,48,36,0.5) 0%, transparent 55%),
                #060d08;
            -webkit-font-smoothing:antialiased;
        }
        .box{max-width:540px;}
        .check{
            width:64px; height:64px; margin:0 auto 32px;
            border:1.5px solid var(--accent-mid); border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            color:var(--accent-mid); font-size:1.6rem;
        }
        .label{
            font-size:0.7rem; text-transform:uppercase; letter-spacing:0.2em;
            color:rgba(255,255,255,0.35); margin-bottom:20px;
        }
        h1{
            font-family:var(--serif); font-weight:300; font-style:italic;
            font-size:clamp(2.6rem,6vw,4.5rem); line-height:1.02; letter-spacing:-0.02em; margin-bottom:20px;
        }
        p{font-size:1rem; color:var(--muted); line-height:1.7; margin-bottom:40px;}
        .back{
            display:inline-flex; align-items:center; gap:10px;
            background:var(--accent-mid); color:#fff; text-decoration:none;
            font-size:0.92rem; font-weight:500; padding:15px 34px; border-radius:50px;
            transition:opacity 0.25s, gap 0.3s ease;
        }
        .back:hover{opacity:0.85; gap:16px;}
    </style>
</head>
<body>
    <main class="box">
        <div class="check" aria-hidden="true">✓</div>
        <div class="label">Contacto</div>
        <h1>¡Mensaje enviado!</h1>
        <p>Gracias por escribir. Te respondo en menos de 24&nbsp;horas.</p>
        <a href="/" class="back">Volver al inicio <span aria-hidden="true">→</span></a>
    </main>
</body>
</html>
